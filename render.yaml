services:
  - type: web
    name: academia-moving
    runtime: node
    rootDir: moving
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/setup-status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: moving-data
      mountPath: /var/data
      sizeGB: 1
